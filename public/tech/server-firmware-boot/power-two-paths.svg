<text x="430.0" y="21.9" fill="#23201c" font-size="20" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">通电 ≠ 能干活：服务器电源的两路分工</tspan>
</text>
<text x="110.0" y="184.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="110.0" dy="0.0">电源线插上</tspan>
<tspan x="110.0" dy="20.0">接市电</tspan>
</text>
<text x="430.0" y="47.8" fill="#8c887f" font-size="13" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">常通，不受开关机键控制</tspan>
</text>
<text x="430.0" y="101.3" fill="#23201c" font-size="18" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">待机电源</tspan>
</text>
<text x="730.0" y="91.4" fill="#23201c" font-size="14" font-weight="400" text-anchor="middle">
<tspan x="730.0" dy="0.0">BMC 等小部件</tspan>
<tspan x="730.0" dy="17.5">持续醒着</tspan>
</text>
<text x="430.0" y="269.8" fill="#8c887f" font-size="13" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">默认关闭，由 PWR_ON 信号决定通不通</tspan>
</text>
<text x="430.0" y="325.3" fill="#23201c" font-size="18" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">主电源</tspan>
</text>
<text x="730.0" y="315.4" fill="#23201c" font-size="14" font-weight="400" text-anchor="middle">
<tspan x="730.0" dy="0.0">CPU / 内存 / 硬盘</tspan>
<tspan x="730.0" dy="17.5">显卡等大件通电</tspan>
</text>
<text x="430.0" y="389.8" fill="#8c887f" font-size="13" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">只有 PWR_ON 信号被拉动，主机大件才真正通电、CPU 才开始复位</tspan>
</text>
