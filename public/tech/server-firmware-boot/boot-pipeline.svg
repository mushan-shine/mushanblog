<text x="430.0" y="24.5" fill="#23201c" font-size="22" font-weight="600" text-anchor="middle">
<tspan x="430.0" dy="0.0">固件的链路：从 CPU 复位到交棒</tspan>
</text>
<text x="430.0" y="74.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">1. CPU 通电与复位</tspan>
</text>
<text x="616.0" y="72.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">内部强制刷成厂商规定的初始状态，程序计数器指向复位向量</tspan>
</text>
<text x="430.0" y="152.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">2. 取第一条指令</tspan>
</text>
<text x="616.0" y="150.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">复位向量的地址被硬件线路焐死指向主板 SPI 固件芯片</tspan>
</text>
<text x="430.0" y="230.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">3. 借 CPU 缓存当内存</tspan>
</text>
<text x="616.0" y="228.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">DRAM 还不能用，固件借缓存做最早的芯片组基础设置</tspan>
</text>
<text x="430.0" y="308.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">4. 拉起真内存</tspan>
</text>
<text x="616.0" y="306.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">固件跑内存初始化，主机才有真正可用的大块内存(DRAM)</tspan>
</text>
<text x="430.0" y="386.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">5. POST 自检</tspan>
</text>
<text x="616.0" y="384.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">检查 CPU、内存、关键设备是否正常，自检码交给 BMC 独立读取</tspan>
</text>
<text x="430.0" y="464.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">6. 枚举并初始化设备</tspan>
</text>
<text x="616.0" y="462.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">遍历 PCIe 总线把网卡/RAID卡/GPU 等一个个找出来初始化</tspan>
</text>
<text x="430.0" y="542.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">7. 整理交接资料</tspan>
</text>
<text x="616.0" y="540.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">把硬件信息整理成 ACPI / SMBIOS 标准表格留给操作系统</tspan>
</text>
<text x="430.0" y="620.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">8. 加载引导程序</tspan>
</text>
<text x="616.0" y="618.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">按启动顺序找到启动设备，读取该设备上的引导程序</tspan>
</text>
<text x="430.0" y="698.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="430.0" dy="0.0">9. 交棒退场</tspan>
</text>
<text x="616.0" y="696.5" fill="#8c887f" font-size="12.5" font-weight="400" text-anchor="start">
<tspan x="616.0" dy="0.0">把 bootloader 加载起来并移交控制权，固件主体任务结束</tspan>
</text>
</svg>