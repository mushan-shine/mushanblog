<text x="470.0" y="34.5" fill="#23201c" font-size="22" font-weight="600" text-anchor="middle">
<tspan x="470.0" dy="0.0">操作系统：硬件大管家的四个角色</tspan>
</text>
<text x="180.0" y="144.4" fill="#23201c" font-size="17" font-weight="400" text-anchor="middle">
<tspan x="180.0" dy="0.0">一堆硬件</tspan>
<tspan x="180.0" dy="21.2">要跑一堆程序</tspan>
</text>
<text x="300.0" y="72.9" fill="#8c887f" font-size="14" font-weight="400" text-anchor="start">
<tspan x="300.0" dy="0.0">服务器资源有限，要争夺</tspan>
</text>
<text x="650.0" y="74.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="650.0" dy="0.0">资源调度者</tspan>
</text>
<text x="300.0" y="148.9" fill="#8c887f" font-size="14" font-weight="400" text-anchor="start">
<tspan x="300.0" dy="0.0">硬件太难用，要进一步抽象</tspan>
</text>
<text x="650.0" y="150.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="650.0" dy="0.0">硬件抽象者</tspan>
</text>
<text x="300.0" y="224.9" fill="#8c887f" font-size="14" font-weight="400" text-anchor="start">
<tspan x="300.0" dy="0.0">共享资源会互相伤害，得守护</tspan>
</text>
<text x="650.0" y="226.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="650.0" dy="0.0">安全守护者</tspan>
</text>
<text x="300.0" y="300.9" fill="#8c887f" font-size="14" font-weight="400" text-anchor="start">
<tspan x="300.0" dy="0.0">程序被限权却想办事，得开门</tspan>
</text>
<text x="650.0" y="302.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="650.0" dy="0.0">内核接口提供者</tspan>
</text>
