<line x1="382.0" y1="210.0" x2="478.0" y2="210.0" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_9a978f)"/>
<line x1="640.0" y1="239.0" x2="640.0" y2="290.0" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_9a978f)"/>
<text x="430.0" y="34.5" fill="#23201c" font-size="22" font-weight="600" text-anchor="middle">
<tspan x="430.0" dy="0.0">用户态 / 内核态：一次系统调用</tspan>
</text>
<text x="220.0" y="89.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="220.0" dy="0.0">用户态 (Ring 3)</tspan>
<tspan x="220.0" dy="20.0">普通程序，无特权</tspan>
</text>
<text x="640.0" y="89.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="640.0" dy="0.0">内核态 (Ring 0)</tspan>
<tspan x="640.0" dy="20.0">最高权限，管全局资源</tspan>
</text>
<text x="236.0" y="162.0" fill="#8c887f" font-size="13" font-weight="400" text-anchor="start">
<tspan x="236.0" dy="0.0">要操作硬件，无权限</tspan>
</text>
<text x="220.0" y="214.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="220.0" dy="0.0">发起系统调用 (陷入)</tspan>
</text>
<text x="640.0" y="214.7" fill="#23201c" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="640.0" dy="0.0">CPU 切到内核态</tspan>
</text>
<text x="640.0" y="313.1" fill="#23201c" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="640.0" dy="0.0">按调用号查表→处理函数</tspan>
<tspan x="640.0" dy="18.8">校验参数与权限→执行</tspan>
</text>
<text x="150.0" y="417.0" fill="#8c887f" font-size="13" font-weight="400" text-anchor="start">
<tspan x="150.0" dy="0.0">内核把 CPU 切到内核态，跳到内核预设的固定入口，办完再返回用户态</tspan>
</text>
</svg>